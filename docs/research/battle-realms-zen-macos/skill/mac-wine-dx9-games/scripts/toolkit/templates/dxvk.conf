# dxvk.conf for Battle Realms: Zen Edition (D3D9, 32-bit) on Apple Silicon via MoltenVK.
# Lives next to Battle_Realms_F.exe; DXVK/D9VK read it from the game's working directory,
# so it applies whether the game is started from Finder, Steam, or `brz-mac.sh launch`.
#
# Change one line at a time and record a bench row after each change:
#   ./brz-mac.sh conf dxvk set d3d9.floatEmulation Strict
# Keys a build doesn't know are ignored, so this one file serves both builds:
#   [d9vk]  = bundled / Sikarugir D9VK (DXVK 1.10.3-async + Metal hacks)
#   [3.x]   = metalsharp DXVK-MacOS (DXVK 3.1 + MoltenVK fork)

# --- Black units / black models -------------------------------------------
# Old D3D9 shaders rely on 0 * inf = 0. Without emulation that becomes NaN and
# the pixel goes black. Strict is the safest; True is faster if Strict costs FPS.   [d9vk][3.x]
d3d9.floatEmulation = Strict

# MoltenVK cannot express D3D9's aliased sampler bindings; the fork's de-aliased
# path fixes textures that otherwise sample as black.                               [3.x]
d3d9.deAliasedSamplers = True

# Step 2 if units are still black: bake sampler types into the shaders.            [d9vk][3.x]
# d3d9.forceSamplerTypeSpecConstants = True

# Step 3: report a lower shader model so the game picks its simpler path.           [d9vk][3.x]
# d3d9.shaderModel = 2

# --- Stutter when new units/effects appear ------------------------------------
# Each new unit type or effect needs a new pipeline; on a Mac every one is compiled
# SPIR-V -> Metal. Async compiles in the background (brief pop-in instead of a hitch);
# the state cache (<exe>.dxvk-cache next to the game) makes later sessions smoother. [d9vk]
dxvk.enableAsync = True
dxvk.enableStateCache = True

# --- Frame pacing (base M1: avoid heat/throttle in long battles) -----------
d3d9.maxFrameRate = 60
d3d9.maxFrameLatency = 1
d3d9.presentInterval = 1

# --- Stability ----------------------------------------------------------------
d3d9.deferSurfaceCreation = True
d3d9.samplerAnisotropy = 0

# --- Diagnostics -----------------------------------------------------------------
# On-screen HUD even when started from Finder (same as DXVK_HUD).                   [d9vk][3.x]
# dxvk.hud = fps,frametimes,drawcalls,pipelines,version,api
