# dxvk.conf for Battle Realms: Zen Edition (D3D9, 32-bit) on Apple Silicon via MoltenVK.
# Lives next to Battle_Realms_F.exe. Change one line at a time and log a bench row after each change:
#   ./brz-mac.sh conf dxvk set d3d9.floatEmulation Strict
# Unknown keys are ignored by DXVK, so fork-only options are safe to leave in.

# --- Black units / black models -------------------------------------------
# MoltenVK cannot express D3D9's aliased sampler bindings; the metalsharp fork's
# de-aliased path fixes textures that otherwise sample as black. (fork-only key)
d3d9.deAliasedSamplers = True

# Old D3D9 shaders rely on 0 * inf = 0. Without emulation that becomes NaN and
# the pixel goes black. Strict is the safest; True is faster if Strict costs FPS.
d3d9.floatEmulation = Strict

# Step 2 if units are still black: bake sampler types into the shaders.
# d3d9.forceSamplerTypeSpecConstants = True

# Step 3: report a lower shader model so the game picks its simpler path.
# d3d9.shaderModel = 2

# --- Frame pacing (base M1: avoid heat/throttle in long battles) -----------
d3d9.maxFrameRate = 60
d3d9.maxFrameLatency = 1
d3d9.presentInterval = 1

# --- Stability ----------------------------------------------------------------
d3d9.deferSurfaceCreation = True
d3d9.samplerAnisotropy = 0
