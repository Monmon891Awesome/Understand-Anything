; dgVoodoo.conf (partial) for Battle Realms: Zen Edition — D3D9 -> D3D11, drawn by DXMT (Metal).
; dgVoodoo fills in defaults for keys that are missing. To check or fine-tune it, run
; dgVoodooCpl.exe from the same folder inside the wrapper and save over this file.

[General]

OutputAPI                 = d3d11_fl11_0
Adapters                  = all
FullScreenMode            = false
ScalingMode               = unspecified
KeepWindowAspectRatio     = true

[DirectX]

DisableAndPassThru        = false
VideoCard                 = internal3D
VRAM                      = 512
Filtering                 = appdriven
Antialiasing              = appdriven
dgVoodooWatermark         = false
FastVideoMemoryAccess     = true
